{% extends "base.html" %}

{% block title %}ሥራ ማጠናቀቂያ (Complete Work Order){% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 650px;">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        
        <!-- Header Section -->
        <div class="card-header bg-dark text-white p-4 text-center border-bottom border-warning border-3">
            <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold mb-2">
                <i class="bi bi-tools me-1"></i> Maintenance Task Completion
            </span>
            <h3 class="fw-bold mb-1">ሥራውን ይጨርሱ</h3>
            <div class="fs-6 text-light font-monospace opacity-75">
                #WO-{{ wo_id or '20260827-5BC5' }}
            </div>
        </div>

        <div class="card-body p-4 bg-light">
            <form method="POST" enctype="multipart/form-data">
                
                <!-- 📸 Photo Upload Box -->
                <div class="card border-primary border-2 border-dashed bg-white p-3 text-center mb-4 rounded-3 shadow-sm">
                    <label class="form-label fw-bold text-dark mb-2">
                        <i class="bi bi-camera-fill fs-4 text-primary d-block mb-1"></i>
                        የተሰራበትን የሚያሳይ ፎቶ ያንሱ / ያስገቡ
                    </label>
                    <input type="file" name="photo" accept="image/*" capture="environment" class="form-control form-control-lg mb-2" required>
                    <small class="text-muted"><i class="bi bi-info-circle me-1"></i>በስልክዎ ካሜራ የተገኘውን ውጤት ፎቶ ያንሱ::</small>
                </div>

                <!-- 📝 Work Done Description -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark">
                        <i class="bi bi-card-text me-1 text-primary"></i> የተሰራው ስራ
                    </label>
                    <textarea name="work_done" class="form-control shadow-sm" rows="3" placeholder="የተከናወነውን ጥገና በዝርዝር ይፃፉ..." required></textarea>
                </div>

                <!-- ⏱️ Work Hours -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark">
                        <i class="bi bi-clock-history me-1 text-primary"></i> የስራ ሰዓት (የፈጀው ጊዜ)
                    </label>
                    <input type="number" step="0.5" name="hours_spent" class="form-control shadow-sm" placeholder="ምሳሌ፡ 04" required>
                </div>

                <!-- 📌 Notes -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark">
                        <i class="bi bi-journal-text me-1 text-primary"></i> ማስታወሻ
                    </label>
                    <textarea name="notes" class="form-control shadow-sm" rows="2" placeholder="ተጨማሪ ማስታወሻ ካለ ይጻፉ..."></textarea>
                </div>

                <!-- 🧰 Used Items Section -->
                <div class="card border-0 shadow-sm p-3 mb-4 bg-white rounded-3">
                    <label class="form-label fw-bold text-dark mb-2">
                        <i class="bi bi-box-seam me-1 text-primary"></i> የተጠቀሙት እቃዎች
                    </label>
                    <div class="row g-2">
                        <div class="col-8">
                            <select name="used_item" class="form-select">
                                <option value="">-- እቃ --</option>
                                <option value="1">Cable / ኬብል</option>
                                <option value="2">Bulb / ባልብ</option>
                                <option value="3">Socket / ሶኬት</option>
                            </select>
                        </div>
                        <div class="col-4">
                            <input type="number" name="item_qty" class="form-control" placeholder="ብዛት" min="1" value="1">
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2 w-100">
                        <i class="bi bi-plus-circle me-1"></i> + እቃ ጨምር
                    </button>
                </div>

                <!-- 🚀 Submit Button -->
                <button type="submit" class="btn btn-success btn-lg w-100 py-3 shadow border-0 fw-bold rounded-3 fs-5">
                    <i class="bi bi-check-circle-fill me-2"></i> ሥራውን ጨርስ / Complete Task
                </button>

            </form>
        </div>
    </div>
</div>
{% endblock %}
