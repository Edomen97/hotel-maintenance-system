{% extends "base.html" %}

{% block title %}New Service Request | Rori Hotel{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <div class="card-modern glass-card shadow-glow border-0 rounded-4 overflow-hidden">
        
        <!-- HEADER -->
        <div class="p-4 p-md-5" style="background: linear-gradient(135deg, #6C3CE1, #4F1C9E);">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-white text-dark bg-opacity-20 px-3 py-2 rounded-pill fw-normal">
                        <i class="bi bi-plus-circle me-2"></i> New Request
                    </span>
                    <h3 class="text-white fw-bold mt-2 mb-0">Service Request</h3>
                </div>
                <div>
                    <span class="badge bg-white text-primary fw-semibold px-3 py-2 rounded-pill fs-6">
                        #NEW
                    </span>
                </div>
            </div>
            
            <div class="mt-3 d-flex align-items-center gap-3">
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-normal">
                    <i class="bi bi-clock-history me-1"></i> Step 1 of 2
                </span>
                <div class="progress flex-grow-1" style="height: 6px; background: rgba(255,255,255,0.2);">
                    <div class="progress-bar bg-warning" role="progressbar" style="width: 50%;"></div>
                </div>
            </div>
        </div>

        <!-- BODY -->
        <div class="p-4 p-md-5">
            <form method="POST" action="{{ url_for('create_request') }}" enctype="multipart/form-data">
                
                <!-- ====== LOCATION TYPE ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-geo-alt text-primary me-2"></i>Location Type
                    </label>
                    <select name="location_type" class="form-select" id="locationType" onchange="toggleLocationFields()" required>
                        <option value="">Select location type</option>
                        <option value="Room">🏨 Room</option>
                        <option value="Hotel Area">📍 Hotel Area</option>
                    </select>
                </div>

                <!-- ====== ROOM SELECTION ====== -->
                <div class="mb-3" id="roomField" style="display: none;">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-door-open text-primary me-2"></i>Select Room
                    </label>
                    <select name="room_id" class="form-select">
                        <option value="">-- Select Room (201-300) --</option>
                        {% for room in rooms %}
                            <option value="{{ room.id }}">Room {{ room.room_number }} (Floor {{ room.floor }})</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Only rooms 201-300 are available</small>
                </div>

                <!-- ====== AREA SELECTION ====== -->
                <div class="mb-3" id="areaField" style="display: none;">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-map text-primary me-2"></i>Select Area
                    </label>
                    <select name="area_id" class="form-select">
                        <option value="">-- Select Area --</option>
                        {% for area in areas %}
                            <option value="{{ area.id }}">{{ area.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ====== WORKING ITEM ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tools text-primary me-2"></i>Working Item
                    </label>
                    <select name="working_item_id" class="form-select" required>
                        <option value="">-- Select Item --</option>
                        {% for item in items %}
                            <option value="{{ item.id }}">{{ item.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ====== CATEGORY ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tags text-primary me-2"></i>Category
                    </label>
                    <select name="category_id" class="form-select" required>
                        <option value="">-- Select Category --</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ====== DEPARTMENT ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-building text-primary me-2"></i>Department
                    </label>
                    <select name="department_id" class="form-select" required>
                        <option value="">-- Select Department --</option>
                        {% for department in departments %}
                            <option value="{{ department.id }}">{{ department.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ====== PRIORITY (SLA) ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-flag text-primary me-2"></i>Priority (SLA)
                    </label>
                    <select name="priority" class="form-select" required>
                        <option value="LOW">🟢 ዝቅተኛ (Low) - 72 ሰዓት</option>
                        <option value="MEDIUM" selected>🟡 መካከለኛ (Medium) - 24 ሰዓት</option>
                        <option value="HIGH">🟠 ከፍተኛ (High) - 4 ሰዓት</option>
                        <option value="URGENT">🔴 አስቸኳይ (Urgent) - 1 ሰዓት</option>
                    </select>
                    <small class="text-muted">SLA response time based on priority</small>
                </div>

                <!-- ====== DUE DATE ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-calendar-event text-primary me-2"></i>Due Date (Optional)
                    </label>
                    <input type="datetime-local" name="due_date" class="form-control">
                </div>

                <!-- ====== DESCRIPTION ====== -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-card-text text-primary me-2"></i>Description
                    </label>
                    <textarea name="description" class="form-control" rows="4" 
                              placeholder="Describe the maintenance issue in detail..." required></textarea>
                </div>

                <!-- ====== PHOTO UPLOAD ====== -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-image text-primary me-2"></i>Photo (Optional)
                    </label>
                    <div class="upload-zone border-2 border-dashed rounded-4 p-3 text-center bg-light" 
                         style="border-color: #D1D5DB; transition: all 0.3s; cursor: pointer;"
                         onmouseover="this.style.borderColor='#6C3CE1'" 
                         onmouseout="this.style.borderColor='#D1D5DB'">
                        <input type="file" name="photo" accept="image/*" capture="environment" class="d-none" id="photoInput">
                        <label for="photoInput" class="d-block cursor-pointer" style="cursor: pointer;">
                            <i class="bi bi-cloud-upload display-4 text-primary d-block mb-2"></i>
                            <span class="fw-semibold text-dark">Tap to upload a photo</span>
                            <div class="text-muted small mt-1">JPG, PNG, GIF (max 16MB)</div>
                        </label>
                    </div>
                </div>

                <!-- ====== SUBMIT ====== -->
                <button type="submit" class="btn btn-success-gradient w-100 py-3 fw-bold fs-5 rounded-4 shadow-glow">
                    <i class="bi bi-send-fill me-2"></i> Submit Request
                </button>

            </form>
        </div>

        <!-- FOOTER -->
        <div class="p-3 text-center border-top" style="background: #F8FAFC;">
            <small class="text-muted">
                <i class="bi bi-shield-check me-1"></i> Your request will be reviewed by the maintenance team
            </small>
        </div>
    </div>
</div>

<style>
    .upload-zone {
        cursor: pointer;
        transition: all 0.25s ease;
    }
    .upload-zone:hover {
        background: rgba(108, 60, 225, 0.04);
        border-color: #6C3CE1 !important;
    }
    .cursor-pointer {
        cursor: pointer;
    }
    .shadow-glow {
        box-shadow: 0 8px 32px rgba(108, 60, 225, 0.15);
    }
    .badge.bg-white.text-dark.bg-opacity-20 {
        background: rgba(255, 255, 255, 0.15) !important;
        color: #FFFFFF !important;
    }
</style>

<script>
    function toggleLocationFields() {
        var type = document.getElementById('locationType').value;
        document.getElementById('roomField').style.display = (type === 'Room') ? 'block' : 'none';
        document.getElementById('areaField').style.display = (type === 'Hotel Area') ? 'block' : 'none';
    }
</script>
{% endblock %}
