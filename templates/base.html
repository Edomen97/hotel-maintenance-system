<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rori Hotel Maintenance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .sidebar { background-color: #1e293b; min-height: 100vh; }
        .nav-link { color: #cbd5e1 !important; margin-bottom: 2px; border-radius: 8px; font-size: 0.95rem; }
        .nav-link:hover, .nav-link.active { background-color: #334155; color: #f59e0b !important; }
        .brand-logo { max-height: 38px; width: auto; margin-right: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- Top Bar (Logo & Title) -->
<nav class="navbar navbar-dark bg-dark sticky-top shadow-sm px-3">
    <div class="container-fluid p-0">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard">
            <img src="/static/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <span class="fw-bold text-warning fs-5">Rori Hotel</span>
        </a>
        <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Full Navigation Menu -->
        <div class="collapse d-md-block col-md-3 col-lg-2 sidebar p-3" id="sidebarMenu">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-house-door me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/requests/new"><i class="bi bi-plus-circle me-2"></i>New Request</a></li>
                <li class="nav-item"><a class="nav-link" href="/requests"><i class="bi bi-list-task me-2"></i>All Requests</a></li>
                <li class="nav-item"><a class="nav-link" href="/work_orders"><i class="bi bi-journal-text me-2"></i>Work Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="/rooms"><i class="bi bi-door-closed me-2"></i>Rooms</a></li>
                <li class="nav-item"><a class="nav-link" href="/areas"><i class="bi bi-geo-alt me-2"></i>Areas</a></li>
                <li class="nav-item"><a class="nav-link" href="/inventory"><i class="bi bi-box-seam me-2"></i>Inventory</a></li>
                <li class="nav-item"><a class="nav-link" href="/preventive"><i class="bi bi-calendar-event me-2"></i>Preventive</a></li>
                <li class="nav-item"><a class="nav-link" href="/checklists"><i class="bi bi-card-checklist me-2"></i>Checklists</a></li>
                <li class="nav-item"><a class="nav-link" href="/suppliers"><i class="bi bi-truck me-2"></i>Suppliers</a></li>
                <li class="nav-item"><a class="nav-link" href="/contractors"><i class="bi bi-person-badge me-2"></i>Contractors</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees"><i class="bi bi-people me-2"></i>Employees</a></li>
                <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-bar-chart-line me-2"></i>Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="/notifications"><i class="bi bi-bell me-2"></i>Notifications</a></li>
                
                <hr class="text-secondary my-2">
                
                <li class="nav-item">
                    <a class="nav-link text-danger fw-bold" href="/logout">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Page Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
