{% extends "base.html" %}

{% block content %}
<div class="container my-4" style="max-width: 900px; color: #e0e0e0;">
    <div class="card bg-dark border-secondary p-3 p-md-4 shadow-lg">
        
        <h2 class="text-warning mb-1">Backup & Restore</h2>
        <p class="text-muted"><small>Rori Hotel Maintenance Management System</small></p>
        <hr class="border-secondary mb-4">

        <div class="mb-4">
            <form action="{{ url_for('create_backup') }}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-warning fw-bold px-4 py-2 text-dark">
                    📦 Backup Now
                </button>
            </form>
        </div>

        <h4 class="text-warning mb-3">Existing Backups</h4>

        <!-- ሰንጠረዡ በስልክ ላይ በጎን እንዲሸራተት የሚያደርግ wrapper -->
        <div style="overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch;">
            <table class="table table-dark table-hover border-secondary align-middle mb-0">
                <thead>
                    <tr class="text-warning border-bottom border-secondary">
                        <th scope="col">FILE</th>
                        <th scope="col" class="text-end">ACTION</th>
                    </tr>
                </thead>
                <tbody>
                    {% if backups %}
                        {% for backup in backups %}
                        <tr>
                            <!-- የፋይሉ ስም ወደ ታች እንዲታጠፍ ያደርጋል -->
                            <td style="word-break: break-all; font-family: monospace; font-size: 0.88rem;">
                                {{ backup }}
                            </td>
                            <td class="text-end" style="white-space: nowrap;">
                                <form action="{{ url_for('restore_backup', filename=backup) }}" method="POST" class="d-inline" onsubmit="return confirm('እርግጠኛ ነዎት ይህንን ዳታቤዝ ወደ ነበረበት መመለስ ይፈልጋሉ?');">
                                    <button type="submit" class="btn btn-warning btn-sm fw-bold px-3 text-dark">
                                        ↺ Restore
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="2" class="text-center text-muted py-3">
                                ምንም የተቀመጠ የባክአፕ ፋይል የለም።
                            </td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>

    </div>
</div>
{% endblock %}
