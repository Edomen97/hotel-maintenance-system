{% extends "base.html" %}

{% block title %}አዲስ የጥገና ጥያቄ ማስገቢያ{% endblock %}

{% block content %}
<div class="container my-4" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>አዲስ የጥገና ጥያቄ አስገባ</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="/requests/new">
                
                <div class="mb-3">
                    <label for="room_number" class="form-label fw-bold">የክፍል ቁጥር / ቦታ</label>
                    <input type="text" class="form-control" id="room_number" name="room_number" placeholder="ለምሳሌ፡ Room 102 ወይም Kitchen" required>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">የችግሩ አጭር ርዕስ</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="ለምሳሌ፡ የኮንዲሽነር ብልሽት" required>
                </div>

                <div class="mb-3">
                    <label for="priority" class="form-label fw-bold">የአስቸኳይነት ደረጃ (Priority)</label>
                    <select class="form-select" id="priority" name="priority" required>
                        <option value="LOW">መደበኛ (Low)</option>
                        <option value="MEDIUM" selected>መከለኛ (Medium)</option>
                        <option value="HIGH">ከፍተኛ (High)</option>
                        <option value="URGENT">በጣም አስቸኳይ (Urgent)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-bold">የችግሩ ዝርዝር ማብራሪያ</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="ስለ ችግሩ ዝርዝር መረጃ እዚህ ይጻፉ..."></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="/requests" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> ተመለስ
                    </a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-check-circle me-1"></i> ጥያቄውን መዝግብ
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
