```html
{% block content %}
<div class="container d-flex justify-content-center align-items-start min-vh-100 py-4">
    <div class="card glass-card border-0 shadow-lg w-100" style="max-width: 600px; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); border-radius: 32px; overflow: hidden;">

        <!-- Header -->
        <div class="card-header bg-transparent border-0 px-4 pt-4 pb-0">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-dark bg-opacity-10 text-dark fw-normal px-3 py-2 rounded-pill">
                        <i class="bi bi-tools me-2"></i> Maintenance Task
                    </span>
                    <h5 class="fw-bold mt-2 mb-0 text-dark">Complete Work</h5>
                </div>
                <div class="text-end">
                    <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-3 py-2 rounded-pill">
                        #WO-{{ wo_id or '0000' }}
                    </span>
                </div>
            </div>
            <!-- Step indicator -->
            <div class="mt-3 d-flex align-items-center gap-2">
                <span class="badge bg-success rounded-pill px-3 py-2 fw-normal">
                    <i class="bi bi-check-circle-fill me-1"></i> Step 3 of 4
                </span>
                <div class="progress flex-grow-1" style="height: 6px;">
                    <div class="progress-bar bg-success" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="card-body px-4 py-4">
            <form method="POST" enctype="multipart/form-data" id="completeForm">

                <!-- Photo Upload -->
                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark">
                        <i class="bi bi-camera text-primary me-2"></i>Photo Evidence
                    </label>
                    <div class="upload-zone border-2 border-dashed border-primary rounded-4 p-4 text-center bg-light bg-opacity-50" style="border-color: #0d6efd; transition: all 0.2s;">
                        <input type="file" name="photo" accept="image/*" capture="environment" class="d-none" id="photoInput">
                        <label for="photoInput" class="d-block cursor-pointer">
                            <i class="bi bi-camera-fill display-4 text-primary d-block mb-2"></i>
                            <span class="fw-semibold text-dark">Tap to capture or select</span>
                            <div class="text-muted small mt-1">Use your camera to take a photo of the completed work</div>
                        </label>
                    </div>
                </div>

                <!-- Work Done -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">
                        <i class="bi bi-card-text text-primary me-2"></i>Work Performed
                    </label>
                    <textarea name="work_done" class="form-control form-control-lg shadow-sm" rows="3" placeholder="Describe the maintenance work completed..." required></textarea>
                </div>

                <!-- Hours Spent -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">
                        <i class="bi bi-clock-history text-primary me-2"></i>Time Spent
                    </label>
                    <div class="input-group">
                        <input type="number" step="0.5" name="hours_spent" class="form-control form-control-lg" placeholder="0.0" required>
                        <span class="input-group-text bg-light text-muted">Hours</span>
                    </div>
                </div>

                <!-- Notes -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark">
                        <i class="bi bi-journal-text text-primary me-2"></i>Additional Notes
                    </label>
                    <textarea name="notes" class="form-control" rows="2" placeholder="Any extra remarks..."></textarea>
                </div>

                <!-- Spare Parts -->
                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark">
                        <i class="bi bi-box-seam text-primary me-2"></i>Parts Used
                    </label>
                    <div id="parts-container">
                        <div class="row g-2 mb-2 align-items-center">
                            <div class="col-7">
                                <select name="used_item" class="form-select">
                                    <option value="">Select part</option>
                                    {{ part_options|safe }}
                                </select>
                            </div>
                            <div class="col-3">
                                <input type="number" name="item_qty" class="form-control" placeholder="Qty" min="1" value="1">
                            </div>
                            <div class="col-2 text-end">
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('.row').remove()">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm w-100 mt-1" onclick="addPartRow()">
                        <i class="bi bi-plus-circle me-1"></i> Add another part
                    </button>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-4 shadow-lg bg-gradient" style="background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none; transition: transform 0.15s;">
                    <i class="bi bi-check-circle-fill me-2"></i> Complete Task
                </button>
            </form>
        </div>

        <!-- Footer (optional) -->
        <div class="card-footer bg-transparent border-0 text-center pb-3 small text-muted">
            <i class="bi bi-shield-check me-1"></i> All data is securely stored
        </div>
    </div>
</div>

<!-- Inline custom styles -->
<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.75) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .upload-zone {
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
    }
    .upload-zone:hover {
        background: rgba(13, 110, 253, 0.05);
        border-color: #0a58ca !important;
    }
    .upload-zone label {
        cursor: pointer;
    }
    .cursor-pointer {
        cursor: pointer;
    }
    .btn-primary.bg-gradient {
        background: linear-gradient(135deg, #0d6efd, #0a58ca) !important;
    }
    .btn-primary.bg-gradient:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 25px rgba(13, 110, 253, 0.4);
    }
    .form-control, .form-select {
        border-radius: 12px;
        border: 1px solid #e9ecef;
    }
    .form-control:focus, .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
    }
    .badge.bg-dark.bg-opacity-10 {
        background: rgba(0,0,0,0.08) !important;
    }
    .badge.bg-primary.bg-opacity-10 {
        background: rgba(13, 110, 253, 0.12) !important;
    }
    .progress {
        background: #e9ecef;
        border-radius: 10px;
    }
    .progress-bar {
        border-radius: 10px;
    }
    .input-group-text {
        border-radius: 0 12px 12px 0;
    }
    .form-control-lg {
        border-radius: 12px;
    }
    .btn-outline-primary {
        border-radius: 40px;
    }
    .btn-outline-danger {
        border-radius: 40px;
    }
    .btn-sm {
        padding: 0.25rem 0.75rem;
    }
    /* Mobile fine-tuning */
    @media (max-width: 576px) {
        .glass-card {
            border-radius: 24px;
        }
        .card-header {
            padding: 1rem 1.25rem 0.5rem !important;
        }
        .card-body {
            padding: 1.25rem !important;
        }
    }
</style>

<script>
    function addPartRow() {
        const container = document.getElementById('parts-container');
        const template = container.querySelector('.row');
        const newRow = template.cloneNode(true);
        // Clear inputs
        newRow.querySelector('select').selectedIndex = 0;
        newRow.querySelector('input[type="number"]').value = 1;
        // Reset delete button
        const delBtn = newRow.querySelector('.btn-outline-danger');
        delBtn.onclick = function() { this.closest('.row').remove(); };
        container.appendChild(newRow);
    }

    // Optional: auto-remove empty rows? Not needed.
</script>

{% endblock %}
```
