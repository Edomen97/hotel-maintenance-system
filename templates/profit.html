{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2 style="color:#f59e0b;">👤 መገለጫ</h2>
<div class="card">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">ሙሉ ስም</label>
      <input class="form-control" name="full_name" value="{{ user.full_name or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">ኢሜል</label>
      <input type="email" class="form-control" name="email" value="{{ user.email or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">ስልክ</label>
      <input class="form-control" name="phone" value="{{ user.phone or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">አዲስ የይለፍ ቃል</label>
      <input type="password" class="form-control" name="new_password" placeholder="ባዶ ከሆነ አይቀየርም">
    </div>
    <button class="btn btn-primary w-100">💾 አስቀምጥ</button>
  </form>
</div>
{% endblock %}
